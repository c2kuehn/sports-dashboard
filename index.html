<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c1f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sports" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Sports Dashboard</title>
    <!-- Apply a saved Day/Night choice before the first paint, so the page never flashes the other theme. -->
    <script>
      try {
        var t = localStorage.getItem('sports.theme');
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t === 'night' ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      html { background: light-dark(#eef1f6, #0b0c1f); color-scheme: light dark; }
      html[data-theme='light'] { color-scheme: light; }
      html[data-theme='dark'] { color-scheme: dark; }
    </style>
    <script type="module" crossorigin src="./assets/index-_bIuUtMW.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
